<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | (r)evolve</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-revolve.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', monospace;
            background-color: #0d0d0d;
            color: #e0e0e0;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 102, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 102, 204, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        body.dark-mode {
            background-color: #0d0d0d;
            color: #e0e0e0;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #1a1a1a;
        }

        body.light-mode::before {
            background-image:
                linear-gradient(rgba(0, 102, 204, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 102, 204, 0.06) 1px, transparent 1px);
        }

        body.light-mode .logo {
            color: #1a1a1a;
        }

        body.light-mode .logo-r {
            color: #0066cc;
        }

        body.light-mode .tagline {
            color: #4b5563;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: rgba(13, 13, 13, 0.8);
            border: 1px solid rgba(0, 102, 204, 0.3);
            border-radius: 2px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            transition: all 0.2s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            border-color: #0066cc;
            background: rgba(0, 102, 204, 0.1);
        }

        body.light-mode .theme-toggle {
            border-color: rgba(0, 102, 204, 0.3);
            background: rgba(255, 255, 255, 0.8);
        }

        body.light-mode .theme-toggle:hover {
            border-color: #0066cc;
        }

        header {
            padding: 1.5rem 2rem 0.75rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.375rem;
            letter-spacing: -0.03em;
            position: relative;
            z-index: 1;
            text-decoration: none;
            display: inline-block;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .logo-r {
            color: #0066cc;
        }

        .tagline {
            font-size: 0.875rem;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        main {
            flex: 1;
            padding: 1rem;
            position: relative;
            z-index: 1;
            max-width: 100%;
            overflow-x: hidden;
        }

        footer {
            padding: 1rem;
            text-align: center;
            color: #4b5563;
            font-size: 0.625rem;
            border-top: 1px solid rgba(0, 102, 204, 0.1);
            position: relative;
            z-index: 1;
            letter-spacing: 0.05em;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        body.light-mode footer {
            color: #6b7280;
        }

        @media (max-width: 768px) {
            body::before {
                background-size: 30px 30px;
            }

            .logo {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 0.875rem;
            }

            main {
                padding: 1.5rem 0.75rem;
            }

            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2rem;
            }

            .tagline {
                font-size: 0.75rem;
            }

            main {
                padding: 1rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span id="themeIcon">☀️</span>
    </button>

    <header>
        <a href="/" class="logo"><span class="logo-r">(r)</span>evolve</a>
        <p class="tagline">Revolve to Evolve</p>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; 2025 Revolve Team LLC. All Rights Reserved. | <a href="/privacy.html">Privacy Policy</a></p>
    </footer>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            body.classList.add('light-mode');
            themeIcon.textContent = '🌙';
        } else {
            body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>

---
layout: default
---
<style>
    .post-container {
        max-width: 760px;
        margin: 0 auto;
        background: rgba(13, 13, 13, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 102, 204, 0.15);
        padding: 2.5rem;
        border-radius: 2px;
    }

    body.light-mode .post-container {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(0, 102, 204, 0.2);
    }

    .post-header {
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid rgba(0, 102, 204, 0.2);
    }

    .post-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.75rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
        line-height: 1.3;
    }

    body.light-mode .post-title {
        color: #1a1a1a;
    }

    .post-meta {
        font-size: 0.75rem;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .post-content {
        font-size: 0.9375rem;
        line-height: 1.8;
        color: #b0b0b0;
    }

    body.light-mode .post-content {
        color: #4b5563;
    }

    .post-content h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: #ffffff;
        margin: 2rem 0 1rem;
        letter-spacing: -0.01em;
    }

    body.light-mode .post-content h2 {
        color: #1a1a1a;
    }

    .post-content h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.1rem;
        font-weight: 500;
        color: #e0e0e0;
        margin: 1.5rem 0 0.75rem;
    }

    body.light-mode .post-content h3 {
        color: #374151;
    }

    .post-content p {
        margin-bottom: 1.25rem;
    }

    .post-content strong {
        color: #e0e0e0;
        font-weight: 500;
    }

    body.light-mode .post-content strong {
        color: #1a1a1a;
    }

    .post-content em {
        font-style: italic;
    }

    .post-content ul, .post-content ol {
        margin: 1rem 0 1.5rem 1.5rem;
    }

    .post-content li {
        margin-bottom: 0.5rem;
    }

    .post-content a {
        color: #0066cc;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease;
    }

    .post-content a:hover {
        border-bottom-color: #0066cc;
    }

    .post-content blockquote {
        border-left: 3px solid #0066cc;
        margin: 1.5rem 0;
        padding: 1rem 1.5rem;
        background: rgba(0, 102, 204, 0.05);
        font-style: italic;
    }

    .post-content code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875em;
        background: rgba(0, 102, 204, 0.1);
        padding: 0.2em 0.4em;
        border-radius: 2px;
    }

    .post-content pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 1rem;
        border-radius: 2px;
        overflow-x: auto;
        margin: 1.5rem 0;
    }

    .post-content pre code {
        background: none;
        padding: 0;
    }

    .post-content hr {
        border: none;
        border-top: 1px solid rgba(0, 102, 204, 0.2);
        margin: 2rem 0;
    }

    .post-content img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 1.5rem auto;
        border-radius: 2px;
    }

    .post-content img + em {
        display: block;
        text-align: center;
        font-size: 0.8rem;
        color: #6b7280;
        margin-top: -1rem;
        margin-bottom: 1.5rem;
    }

    .post-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        font-size: 0.875rem;
    }

    .post-content th,
    .post-content td {
        border: 1px solid rgba(0, 102, 204, 0.3);
        padding: 0.75rem 1rem;
        text-align: left;
    }

    .post-content th {
        background: rgba(0, 102, 204, 0.1);
        font-weight: 600;
        color: #e0e0e0;
    }

    body.light-mode .post-content th {
        color: #1a1a1a;
        background: rgba(0, 102, 204, 0.08);
    }

    .post-content tr:nth-child(even) {
        background: rgba(0, 102, 204, 0.03);
    }

    .back-link {
        display: inline-block;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(0, 102, 204, 0.2);
        font-size: 0.75rem;
        color: #0066cc;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .back-link:hover {
        color: #3d8bff;
    }

    .back-link::before {
        content: "< ";
    }

    @media (max-width: 768px) {
        .post-container {
            padding: 1.5rem;
        }

        .post-title {
            font-size: 1.5rem;
        }

        .post-content {
            font-size: 0.875rem;
        }
    }
</style>

<article class="post-container">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <a href="/blog/" class="back-link">Back to Blog</a>
</article>

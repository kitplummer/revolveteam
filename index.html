<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3906LB8NYC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3906LB8NYC');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="(r)evolve - Revolve to Evolve. The PBED platform for continuous improvement.">
  <title>(r)evolve - Revolve to Evolve</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2300D9FF'/><text x='50' y='68' font-family='sans-serif' font-size='48' font-weight='700' fill='white' text-anchor='middle'>(r)</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    
    /* Animated background gradient */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 50%);
      animation: gradientShift 15s ease infinite;
      z-index: 0;
    }
    
    @keyframes gradientShift {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .container {
      text-align: center;
      max-width: 600px;
      position: relative;
      z-index: 1;
    }
    
    /* Logo */
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      font-size: clamp(48px, 10vw, 80px);
      line-height: 1;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }
    
    .logo .r {
      color: #00D9FF;
    }
    
    .logo .evolve {
      color: #ffffff;
    }
    
    /* Tagline */
    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: clamp(18px, 3.5vw, 24px);
      font-weight: 500;
      color: #CCCCCC;
      margin-bottom: 60px;
      letter-spacing: 0.05em;
    }
    
    /* Coming Soon Badge */
    .badge {
      display: none;
    }
    
    /* Contact Link */
    .contact {
      display: inline-block;
      background: #00D9FF;
      color: #0a0a0a;
      padding: 16px 40px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
    }
    
    .contact:hover {
      background: #00f0ff;
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
      transform: translateY(-2px);
    }
    
    .contact:active {
      transform: translateY(0);
    }
    
    /* Footer */
    .footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #4A4A4A;
      z-index: 1;
    }
    
    /* Responsive adjustments */
    @media (max-width: 600px) {
      .logo {
        margin-bottom: 16px;
      }
      
      .tagline {
        margin-bottom: 50px;
      }
      
      .badge {
        display: none;
      }
      
      .contact {
        padding: 14px 32px;
        font-size: 15px;
      }
      
      .footer {
        bottom: 20px;
        font-size: 12px;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="r">(r)</span><span class="evolve">evolve</span>
    </div>
    
    <div class="tagline">Revolve to Evolve</div>
    
    <div class="badge">Coming Soon</div>
    
    <a href="mailto:kit@revolveteam.com" class="contact">Get in Touch</a>
  </div>
  
  <div class="footer">
    © 2025 Revolve Team LLC. All Rights Reserved.
  </div>
</body>
</html>
